        <title>FarmTycoon | App</title>
        
        <script>
            // Correctif pour les erreurs de timing de performance sur certains navigateurs
            window.addEventListener("error", function(e) {
                if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }, true);
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        
        <!-- C'est ici que React injecte votre application -->

        <!--

          Ne rajoutez pas de scripts externes Emergent ici.
        -->
    </body>
</html>
